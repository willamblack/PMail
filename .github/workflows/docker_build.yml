name: Docker Image CI

on:
  workflow_dispatch:
  release:
    types: [released]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    # This fork uses docker_build_admin_catchall.yml for stable releases.
    # Never run two publishers against the same version/latest tags.
    if: github.repository != 'willamblack/PMail'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get version
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> ${GITHUB_ENV}
          echo "${GITHUB_REF/refs\/tags\//}"
          echo "${GITHUB_REF#refs/*/}"
          echo "${GITHUB_REF}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set lower case repository name
        run: |
          echo "REPOSITORY_LC=${REPOSITORY,,}" >> ${GITHUB_ENV}
        env:
          REPOSITORY: '${{ github.repository }}'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Build FE
        run: |
          echo "$(git show -s --format=%H)"
          echo "GITHASH=$(git show -s --format=%H)" >> ${GITHUB_ENV}
          make build_fe

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          build-args: |
            VERSION=${{ env.VERSION }}
            GITHASH=${{ env.GITHASH }}
          context: .
          file: ./DockerfileGithubAction
          platforms: |
            linux/386
            linux/amd64
            linux/arm/v7
            linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY_LC }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY_LC }}:latest
