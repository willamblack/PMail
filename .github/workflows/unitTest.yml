name: Source regression tests

on:
  pull_request:
    branches: [master, codex/admin-wildcard-catchall]
  push:
    branches: [codex/admin-wildcard-catchall]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: fe/yarn.lock
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: server/go.sum
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22
      - name: Build web UI and test state helpers
        run: |
          make build_fe
          cd fe && node --test tests/review-regressions.test.mjs
      - name: Test isolated SQLite and protocol regressions
        run: make test
      - name: Static Go checks
        run: cd server && go vet ./...
      - name: Race checks
        run: cd server && go test -race -p 1 ./...
