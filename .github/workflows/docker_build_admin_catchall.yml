name: Build admin catch-all image

on:
  # Both maintained branches carry this workflow. Publishing a stable release
  # is the single automatic Docker trigger; merely pushing a tag is not.
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: OCI image tag
        required: true
        default: v2.9.7-admincatchall.1
      publish_latest:
        description: Also publish the latest tag
        required: true
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

concurrency:
  group: admin-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate tag and normalize repository name
        id: image
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          PUBLISH_LATEST: ${{ github.event_name == 'release' || inputs.publish_latest }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid OCI tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          echo "repository=${SOURCE_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "git_hash=$(git show -s --format=%H)" >> "$GITHUB_OUTPUT"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          tags="${REGISTRY}/${SOURCE_REPOSITORY,,}:${REQUESTED_TAG}"
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            tags="${tags},${REGISTRY}/${SOURCE_REPOSITORY,,}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: fe/yarn.lock

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Build web UI
        run: make build_fe

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./DockerfileGithubAction
          platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.image.outputs.tag }}
            GITHASH=${{ steps.image.outputs.git_hash }}
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          sbom: true
