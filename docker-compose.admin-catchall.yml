services:
  pmail:
    image: ${PMAIL_IMAGE:-ghcr.io/your-github-user/pmail:v2.9.7-admincatchall.1}
    container_name: pmail
    restart: unless-stopped
    ports:
      - "25:25"
      - "80:80"
      - "443:443"
      - "110:110"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
    volumes:
      - ./config:/work/config
